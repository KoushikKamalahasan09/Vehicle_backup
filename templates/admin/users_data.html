{% extends "layout.html" %}

{% block style %}
<style>

    body {
        padding-top: 70px; /* Adjust depending on navbar height */
    }

    .table {
        margin-top: 20px;
    }
    .table th, .table td {
        text-align: center;
    }
    .btn-danger {
        font-size: 0.875rem; /* Adjust font size for buttons */
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <h2 class="mt-4">User Management</h2>
    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead class="thead-dark">
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.username }}</td>
                    <td>{{ user.email }}</td>
                    <td>
                        {% if user.is_admin != True %}
                            <form action="{{ url_for('admin.delete_user', user_id=user.id) }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this user?');">
                                <button type="submit" class="btn btn-danger">Delete</button>
                            </form>
                        {% else %}
                            <button class="btn btn-danger" disabled>Cannot Delete</button>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
